# Test settings: an in-memory H2 database in PostgreSQL compatibility mode, so tests need no real DB.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.auth.token-secret=test-secret-for-unit-tests-only
app.auth.token-validity-hours=1
app.admin.email=admin@school.edu
app.admin.password=admin123
app.cors.allowed-origins=*
