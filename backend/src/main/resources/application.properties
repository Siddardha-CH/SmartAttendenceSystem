# ─────────────────────────────────────────────────────────────────────────────
# Local development settings (used by `mvn spring-boot:run`).
# Production overrides live in application-prod.properties.
# Values come from environment variables, or from backend/.env (see .env.example).
# ─────────────────────────────────────────────────────────────────────────────
spring.application.name=backend
server.port=${PORT:8081}

spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartattend}
spring.datasource.driverClassName=${DB_DRIVER:org.postgresql.Driver}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate - "update" creates/extends tables to match the entity classes on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Close the DB session when the controller returns (avoids accidental slow lazy-loading during JSON writing)
spring.jpa.open-in-view=false

# Auth
# Secret used to sign login tokens. MUST be set to a long random string in production.
app.auth.token-secret=${APP_TOKEN_SECRET:}
app.auth.token-validity-hours=${APP_TOKEN_VALIDITY_HOURS:12}
# Initial admin account (only used the very first time, when the users table is empty)
app.admin.email=${ADMIN_EMAIL:admin@school.edu}
app.admin.password=${ADMIN_PASSWORD:admin123}

# CORS - comma-separated list of frontend origins allowed to call the API ("*" = any)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Face images are sent as base64 JSON; allow reasonably large request bodies
server.tomcat.max-http-form-post-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
