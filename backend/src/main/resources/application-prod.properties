# ─────────────────────────────────────────────────────────────────────────────
# Production profile - active when the app runs with spring.profiles.active=prod
# (the backend Dockerfile sets this). Anything not set here falls back to
# application.properties.
#
# Database connection comes from DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# (set in the Render dashboard - e.g. your Supabase "Session pooler" details) and
# DB_SSLMODE (use "require" for Supabase). Render sets PORT for the web server.
# ─────────────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# HikariCP connection pool - small pool for the free tier, and patience while the DB wakes up
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.show-sql=false

# Don't ship stack traces to API clients
server.error.include-stacktrace=never
server.error.include-message=never
