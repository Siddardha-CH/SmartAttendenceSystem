# Render Blueprint - deploys the whole system with one click:
#   Render dashboard -> New -> Blueprint -> pick this repository.
#
#   (database)            Supabase PostgreSQL - created on supabase.com, connection details set below
#   smartattend-backend   Spring Boot API, built from backend/Dockerfile
#   smartattend-frontend  React app, built with npm and served as a static site (free, global CDN)
#
# After the first deploy you must set ONE value by hand (see README "Deploying"):
#   smartattend-frontend -> VITE_API_URL = the backend's URL, e.g. https://smartattend-backend.onrender.com
# then trigger "Manual Deploy -> Clear build cache & deploy" on the frontend.

services:
  # ── Spring Boot Backend (Docker) ──────────────────────────────────────────
  - type: web
    name: smartattend-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Database: Supabase PostgreSQL. Copy these from Supabase -> Connect -> "Session pooler".
      - key: DB_HOST
        sync: false # e.g. aws-0-ap-south-1.pooler.supabase.com
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        value: postgres
      - key: DB_USERNAME
        sync: false # e.g. postgres.abcdefghijklmnop
      - key: DB_PASSWORD
        sync: false # your Supabase database password
      - key: DB_SSLMODE
        value: require
      # Signs login tokens. Render generates a random value once and keeps it.
      - key: APP_TOKEN_SECRET
        generateValue: true
      # Password for the first admin account (admin@school.edu). You are asked for it on first deploy.
      - key: ADMIN_PASSWORD
        sync: false
      # Optionally lock the API to your frontend URL, e.g. https://smartattend-frontend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

  # ── React / Vite Frontend (static site) ───────────────────────────────────
  - type: web
    name: smartattend-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Single-page app: every path (e.g. /dashboard) must serve index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: VITE_API_URL
        sync: false # e.g. https://smartattend-backend.onrender.com  (Vite reads it at BUILD time)
